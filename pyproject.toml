[project]
name = "ai-study-assistant"
version = "0.1.0"
description = "RAG-based Q&A bot for AI certification study materials"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # LLMs
    "google-generativeai>=0.8.0",
    "anthropic>=0.40.0",
    # Vector store
    "chromadb>=0.5.0",
    # Embeddings / ML
    "tiktoken>=0.7.0",
    # Document parsing
    "pymupdf>=1.24.0",
    "markdown>=3.6",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # MCP server
    "fastmcp>=0.4.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    # Utilities
    "tenacity>=9.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
study = "src.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",       # FastAPI TestClient
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
